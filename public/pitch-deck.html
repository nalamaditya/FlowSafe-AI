    let current = 0;

    function renderSlide() {
      const s = slidesData[current];
      const html = `
        <div class="space-y-1.5 pb-4 border-b border-slate-100">
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-200">
              ${s.badge}
            </span>
            <span class="text-xs mono text-slate-400">FlowSafe AI • Synapse³</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">${s.title}</h2>
          <p class="text-xs sm:text-sm text-slate-500 font-medium">${s.subtitle}</p>
        </div>

        <div class="flex-1 flex flex-col justify-center my-4">
          ${s.body}
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
          <span class="mono">Use ◀ ▶ arrow keys</span>
          <span class="mono font-bold text-slate-900">${current + 1} / ${slidesData.length}</span>
        </div>
      `;
      document.getElementById('deckContainer').innerHTML = html;
      document.getElementById('slideCounter').innerText = `${current + 1} / ${slidesData.length}`;
    }

    function nextSlide() {
      if (current < slidesData.length - 1) {
        current++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (current > 0) {
        current--;
        renderSlide();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide();
